<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEB PRO ADMIN — Accès Sécurisé</title>
    <meta name="robots" content="noindex, nofollow">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deb-blue': '#1A3A8F',
                        'deb-yellow': '#FFD600',
                        'deb-red': '#CC1F1F',
                        'deb-navy': '#0D1F4C',
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0D1F4C 0%, #050e2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(13, 31, 76, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-circle {
            background: linear-gradient(135deg, #1A3A8F 0%, #FFD600 100%);
            box-shadow: 0 0 20px rgba(26, 58, 143, 0.5);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        input {
            transition: all 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 0 2px rgba(26, 58, 143, 0.4);
        }

        .btn-check {
            background: linear-gradient(to right, #1A3A8F, #3b82f6);
            transition: all 0.3s ease;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="glass-card w-full max-w-md p-8 rounded-3xl animate-fade-in mx-4" id="login-card">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <div class="logo-circle w-20 h-20 rounded-full flex items-center justify-center text-white text-4xl font-oswald italic">
                D
            </div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-white text-2xl font-oswald tracking-wide font-bold uppercase mb-2">DEB PRO ADMIN</h1>
            <p class="text-blue-300 text-xs font-semibold uppercase tracking-widest opacity-70">Zone réservée — Accès restreint</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="space-y-2">
                <label class="text-white text-xs font-bold uppercase tracking-wider pl-1">Email</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-blue-400">📧</span>
                    <input type="email" id="email" required 
                        class="w-full bg-navy/50 border border-white/10 rounded-xl py-4 pl-12 pr-4 text-white placeholder-white/30 outline-none focus:border-blue-500"
                        placeholder="admin@deb-pro-services.be">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-white text-xs font-bold uppercase tracking-wider pl-1">Mot de passe</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-blue-400">🔒</span>
                    <input type="password" id="password" required 
                        class="w-full bg-navy/50 border border-white/10 rounded-xl py-4 pl-12 pr-12 text-white placeholder-white/30 outline-none focus:border-blue-500"
                        placeholder="••••••••••••">
                    <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-300 hover:text-white transition-colors">
                        👁️
                    </button>
                </div>
            </div>

            <div id="error-message" class="hidden text-deb-red text-sm font-semibold text-center bg-deb-red/10 py-2 rounded-lg border border-deb-red/20">
                Identifiants incorrects. Accès refusé.
            </div>

            <button type="submit" class="w-full btn-check py-4 rounded-xl text-white font-oswald text-lg uppercase tracking-widest flex items-center justify-center gap-3">
                <span id="btn-text">→ Accéder au Dashboard</span>
                <div id="spinner" class="loading-spinner"></div>
            </button>
        </form>

        <div class="mt-10 text-center">
            <p class="text-[10px] text-blue-300/50 uppercase tracking-[0.2em] font-medium">
                🔒 Connexion sécurisée SSL — Accès restreint
            </p>
        </div>
    </div>

    <script>
        // Particles Animation
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#1A3A8F' : '#FFD600';
                this.alpha = Math.random() * 0.5 + 0.1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Login Logic
        const loginForm = document.getElementById('login-form');
        const loginCard = document.getElementById('login-card');
        const errorMsg = document.getElementById('error-message');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');
        const togglePwd = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        // Credentials obfusqués
        const a = atob('YXlvdWJuQGdtYWlsLmNvbQ=='); // ayoubn@gmail.com
        const b = atob('QVlPVUJOT1VBUkAxNDA1OTQ2Ng=='); // AYOUBNOUAR@14059466

        // Check already logged in
        const token = sessionStorage.getItem('deb_token');
        const loginTime = sessionStorage.getItem('deb_login_time');
        if (token && loginTime && (Date.now() - parseInt(loginTime)) < 28800000) {
            window.location.href = '/deb-dashboard';
        }

        togglePwd.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            // Loading state
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMsg.classList.add('hidden');
            loginCard.classList.remove('shake');

            setTimeout(() => {
                if (email === a && password === b) {
                    sessionStorage.setItem('deb_token', btoa(Date.now().toString()));
                    sessionStorage.setItem('deb_login_time', Date.now().toString());
                    window.location.href = '/deb-dashboard';
                } else {
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                    errorMsg.classList.remove('hidden');
                    loginCard.classList.add('shake');
                    
                    // Clear red border after animation
                    setTimeout(() => {
                        loginCard.classList.remove('shake');
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>
</html>
